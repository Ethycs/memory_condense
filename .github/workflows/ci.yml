name: Package and proxy CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      KMP_DUPLICATE_LIB_OK: 'TRUE'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[proxy]" pytest build
      - name: Rebuild portable Linux HNSW extension
        if: runner.os == 'Linux'
        env:
          # A cached -march=native wheel may target a different hosted-runner CPU.
          HNSWLIB_NO_NATIVE: '1'
        run: python -m pip install --force-reinstall --no-deps --no-cache-dir --no-binary=hnswlib hnswlib==0.8.0
      - name: Lint the shell installer and container entrypoint
        if: runner.os == 'Linux'
        # These run on Linux only, and a quoting regression in an installer
        # surfaces on a user's machine rather than in the Python suite.
        run: shellcheck -s bash packaging/install-proxy.sh packaging/docker-entrypoint.sh
      - name: Test proxy, lifecycle, persistence and package boundaries
        run: >-
          python -m pytest -q
          tests/test_proxy_package.py tests/test_proxy_memory.py tests/test_proxy.py
          tests/test_proxy_responses.py
          tests/test_proxy_scheduler.py tests/test_chat_session.py tests/test_chat_streaming.py
          tests/test_inline_memory.py tests/test_engineering_research_resident.py
          tests/test_engineering_research_local.py tests/test_engineering_research_seed.py
          tests/test_resident_embedding_schedule.py tests/test_matched_eval_artifacts.py
          tests/test_matched_eval_contracts.py tests/test_local100_resume.py
          tests/test_inline_validation_gates.py tests/test_memory_scale_stress.py
          tests/test_native_capture.py tests/test_native_spine_incremental_store.py
          tests/test_chat_native.py tests/test_consolidation.py
          tests/test_scale_stress_vector_alignment.py tests/test_scale_inline_recovery.py
          tests/test_summary_api_fallback.py
          tests/test_dialogue_neighborhood.py tests/test_dialogue_neighborhood_eval.py
          tests/test_dialogue_full_context_eval.py
          tests/test_dialogue_retrieval.py
          tests/test_dialogue_index_dump_eval.py
          tests/test_tactic_router.py
          tests/test_automatic_tactics.py
          tests/test_decision_history.py
          tests/test_continuity.py
          tests/test_native_experiments.py
          tests/test_runtime_platform.py
          --junitxml=eval_results/ci-tests.xml
      - name: Build wheel and source distribution
        run: python -m build --outdir dist/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: eval_results/ci-tests.xml

  # The conda package is noarch, so one build serves both platforms. It must be
  # built exactly once: two runners would each produce a same-named package with
  # different bytes, the two per-platform manifests would record different
  # digests for one filename, and the release job (which downloads everything
  # into one dist/) could publish only one of them. Built on Windows because
  # that is the host the published build string pyh4616a5c_0 was produced on.
  conda-package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      CONDA_OVERRIDE_CUDA: '12.6'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.68.1
          run-install: false
          cache: false
      - name: Build the shared noarch package
        run: |
          pixi build --output-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem -LiteralPath dist -Filter 'memory_condense-*.conda')
          if ($packages.Count -ne 1) { throw "Expected one package; found $($packages.Count)" }
          Write-Output "Built $($packages[0].Name)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conda-package
          path: dist/*.conda
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    needs: conda-package
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      # Hosted runners have no GPU; allow dependency resolution, then exercise
      # installation/imports only. Actual GPU execution is a separate assay.
      CONDA_OVERRIDE_CUDA: '12.6'
      RELEASE_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.68.1
          run-install: false
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conda-package
          path: dist
      - name: Build and verify the Windows release bundle
        run: |
          python tools/build_proxy_release.py --platform win64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_proxy_release.py --platform win64 --tag "$env:RELEASE_REF"
      - name: Install the artifact in a separate environment
        run: |
          ./dist/install-proxy.ps1 -InstallDir "$env:RUNNER_TEMP/memory-proxy" -SkipSetup
          & "$env:RUNNER_TEMP/memory-proxy/memory-condense.cmd" proxy --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run --manifest-path "$env:RUNNER_TEMP/memory-proxy/pixi.toml" python -I packaging/verify_installed_proxy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/install-proxy.ps1
            dist/SHA256SUMS-win64.json
          if-no-files-found: error

  linux-package:
    runs-on: ubuntu-latest
    needs: conda-package
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      # Same import-only contract as the Windows job: a hosted runner has no GPU,
      # so this proves packaging and installation, never inference.
      CONDA_OVERRIDE_CUDA: '12.6'
      RELEASE_REF: ${{ github.ref_name }}
      # /mnt is the large ephemeral disk; a linux-64 CUDA torch environment does
      # not comfortably fit on the root filesystem.
      PIXI_CACHE_DIR: /mnt/pixi-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.68.1
          run-install: false
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conda-package
          path: dist
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo mkdir -p /mnt/pixi-cache /mnt/memory-proxy
          sudo chown "$USER" /mnt/pixi-cache /mnt/memory-proxy
          df -h /
      - name: Build and verify the Linux release bundle
        run: |
          python tools/build_proxy_release.py --platform linux64
          python tools/verify_proxy_release.py --platform linux64 --tag "$RELEASE_REF"
      - name: Install the artifact in a separate environment
        run: |
          chmod +x dist/install-proxy.sh
          ./dist/install-proxy.sh --install-dir /mnt/memory-proxy --skip-setup
          /mnt/memory-proxy/memory-condense proxy --help
          pixi run --manifest-path /mnt/memory-proxy/pixi.toml python -I packaging/verify_installed_proxy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: |
            dist/*.tar.gz
            dist/install-proxy.sh
            dist/SHA256SUMS-linux64.json
          if-no-files-found: error

  docker-image:
    runs-on: ubuntu-latest
    needs: conda-package
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conda-package
          path: dist
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - id: meta
        run: |
          version=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # Build the tag list here rather than inline: on a pull request
          # github.ref_name is "<number>/merge", which is not a valid Docker
          # reference, so the git ref is only a tag when it really is one.
          {
            echo "tags<<TAGS"
            echo "$image:$version"
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "$image:$GITHUB_REF_NAME"; fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Deliberately no ':latest' tag while releases publish as prereleases.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packaging/Dockerfile
          build-args: MEMORY_CONDENSE_VERSION=${{ steps.meta.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
      - name: Smoke the image without a GPU
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # No pipe: piping into head would mask a non-zero exit from docker
          # and make this smoke incapable of failing.
          docker run --rm "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"             proxy --help >/tmp/image-help.txt
          head -5 /tmp/image-help.txt
          grep -q -- '--memory-retrieval-policy' /tmp/image-help.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, conda-package, windows-package, linux-package, docker-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conda-package
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-release
          path: dist
      # Only here are all three artifacts co-located, so this is the one place a
      # cross-platform package or manifest mismatch can be caught.
      - name: Re-verify both bundles together
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python tools/verify_proxy_release.py --platform win64 --tag "$RELEASE_REF"
          python tools/verify_proxy_release.py --platform linux64 --tag "$RELEASE_REF"
      - name: Publish verified beta assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/memory-condense-*-win64.zip dist/memory-condense-*-linux64.tar.gz
          dist/memory_condense-*.conda
          dist/install-proxy.ps1 dist/install-proxy.sh
          dist/SHA256SUMS-win64.json dist/SHA256SUMS-linux64.json
          --verify-tag --prerelease --title "Memory Condense $RELEASE_TAG"
          --notes-file packaging/RELEASE_NOTES.md
