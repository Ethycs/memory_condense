name: Package and proxy CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      KMP_DUPLICATE_LIB_OK: 'TRUE'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[proxy]" pytest build
      - name: Test proxy, lifecycle, persistence and package boundaries
        run: >-
          python -m pytest -q
          tests/test_proxy_package.py tests/test_proxy_memory.py tests/test_proxy.py
          tests/test_proxy_scheduler.py tests/test_chat_session.py tests/test_chat_streaming.py
          tests/test_inline_memory.py tests/test_engineering_research_resident.py
          tests/test_engineering_research_local.py tests/test_engineering_research_seed.py
          tests/test_resident_embedding_schedule.py tests/test_matched_eval_artifacts.py
          tests/test_matched_eval_contracts.py tests/test_local100_resume.py
          tests/test_inline_validation_gates.py tests/test_memory_scale_stress.py
          --junitxml=eval_results/ci-tests.xml
      - name: Build wheel and source distribution
        run: python -m build --outdir dist/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: eval_results/ci-tests.xml

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PIXI_OVERRIDE_CUDA: '12.6'
      RELEASE_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.68.1
          run-install: false
          cache: false
      - name: Build Pixi package and release bundle
        run: |
          pixi build --output-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_proxy_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_proxy_release.py --tag "$env:RELEASE_REF"
      - name: Install the artifact in a separate environment
        run: |
          ./dist/install-proxy.ps1 -InstallDir "$env:RUNNER_TEMP/memory-proxy" -SkipSetup
          & "$env:RUNNER_TEMP/memory-proxy/memory-condense.cmd" proxy --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run --manifest-path "$env:RUNNER_TEMP/memory-proxy/pixi.toml" python -I -c "from memory_condense.runtime.sessions import NativeProxySessions; from memory_condense.interfaces.proxy_server import build_app; print('installed-runtime-import-ok')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.conda
            dist/install-proxy.ps1
            dist/SHA256SUMS.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: dist
      - name: Publish verified beta assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.conda dist/install-proxy.ps1 dist/SHA256SUMS.json
          --verify-tag --prerelease --title "Memory Condense $RELEASE_TAG"
          --notes-file packaging/RELEASE_NOTES.md
