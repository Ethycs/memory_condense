[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory_condense"
version = "0.2.1"
description = "Long-term memory condensation system for LLM conversations"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.0,<3",
    "sentence-transformers>=3.0",
    "hnswlib>=0.8",
    "pysbd>=0.3",
    "litellm>=1.40",
    "httpx>=0.28,<1",
    "openai>=2.20,<3",
    "truststore>=0.10.4,<0.11",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
proxy = [
    "starlette>=0.40,<2", "uvicorn>=0.30,<1",
    "torch>=2.7,<3", "transformers>=4.51,<5", "accelerate>=1,<2",
    "safetensors>=0.5", "fastembed==0.8.1", "onnxruntime==1.30.0",
    "nvidia-nvcomp-cu12==5.3.0.16; platform_system == 'Windows'",
]

[project.scripts]
memory-condense = "memory_condense.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_condense"]

[tool.hatch.build.targets.sdist]
include = ["src/memory_condense", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` walks eval_results/ and dies with ~129
# PermissionError collection errors on sealed artifact directories.
testpaths = ["tests"]
markers = [
    "slow: marks tests that require model download (deselect with '-m \"not slow\"')",
]
