[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory_condense"
version = "0.1.0"
description = "Long-term memory condensation system for LLM conversations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "sentence-transformers>=3.0",
    "hnswlib>=0.8",
    "pysbd>=0.3",
    "litellm>=1.40",
    "httpx>=0.28,<1",
    "openai>=2.20,<3",
    "truststore>=0.10.4,<0.11",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_condense"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` walks eval_results/ and dies with ~129
# PermissionError collection errors on sealed artifact directories.
testpaths = ["tests"]
markers = [
    "slow: marks tests that require model download (deselect with '-m \"not slow\"')",
]
