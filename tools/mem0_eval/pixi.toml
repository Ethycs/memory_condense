# Isolated optional runtime for the Mem0 comparison arm.
#
# This is intentionally a separate Pixi workspace.  The repository-root
# pixi.lock is part of the frozen memory-condense validation identity and must
# not change before that campaign is scored and merged.

[workspace]
name = "memory-condense-mem0-oss-2-0-18"
channels = ["conda-forge"]
platforms = ["win-64"]

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.12.13.*"
pytorch-gpu = "==2.7.1"
cuda-version = "12.6.*"
sentence-transformers = "==5.7.0"
transformers = "==4.57.6"
huggingface_hub = "==0.36.0"
pillow = "==11.3.0"
hnswlib = "==0.8.0"
pysbd = "==0.3.4"
click = "==8.4.2"

[pypi-dependencies]
mem0ai = "==2.0.18"
litellm = "==1.96.2"
qdrant-client = "==1.15.1"
fastembed = "==0.7.3"
spacy = "==3.8.7"
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
tiktoken = "==0.13.0"
pydantic = "==2.13.4"
openai = "==2.53.0"
httpx = "==0.28.1"
truststore = "==0.10.4"
